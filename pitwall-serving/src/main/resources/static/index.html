<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitwall</title>
<style>
  :root {
    --bg: #12121f;
    --panel: #1a1a2e;
    --line: #2a2a45;
    --text: #e8e8f0;
    --muted: #8888a8;
    --accent: #f0196a;
    --ok: #35d07f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  header {
    display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap;
    padding: 16px 24px; border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 20px; letter-spacing: 4px; text-transform: uppercase; }
  h1 span { color: var(--accent); }
  .stat { color: var(--muted); }
  .stat b { color: var(--text); font-weight: 600; }
  #status { color: var(--muted); }
  #status.live { color: var(--ok); }
  #status.live::before { content: "\25CF "; }
  #status.down { color: var(--accent); }
  main { display: grid; grid-template-columns: 1fr 340px; gap: 20px; padding: 20px 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  section h2 {
    margin: 0; padding: 12px 16px; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line);
  }
  .cars { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding: 16px; }
  .car { border: 1px solid var(--line); border-radius: 4px; padding: 12px; }
  .car.alerting { border-color: var(--accent); }
  .car h3 { margin: 0 0 8px; font-size: 15px; color: var(--accent); letter-spacing: 1px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .row span:first-child { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row span:last-child { font-variant-numeric: tabular-nums; }
  #alerts { max-height: 420px; overflow-y: auto; padding: 8px 16px 16px; }
  .alert { border-left: 2px solid var(--accent); padding: 6px 10px; margin-top: 8px; background: #21132133; }
  .alert b { color: var(--accent); }
  .alert small { color: var(--muted); display: block; }
  .empty { color: var(--muted); padding: 16px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px; align-items: center; }
  select, button {
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 6px 10px; font: inherit;
  }
  button { border-color: var(--accent); color: var(--accent); cursor: pointer; }
  .chart-wrap { padding: 0 16px 8px; }
  #chart { width: 100%; height: 220px; display: block; }
  #queryNote { color: var(--muted); padding: 0 16px 16px; }
</style>
</head>
<body>
<header>
  <h1>Pit<span>wall</span></h1>
  <span id="status">connecting</span>
  <span class="stat">rollups <b id="rollupCount">0</b></span>
  <span class="stat">alerts <b id="alertCount">0</b></span>
  <span class="stat">channels <b id="channelCount">0</b></span>
</header>

<main>
  <div>
    <section>
      <h2>Live &mdash; latest 1s rollup per channel</h2>
      <div class="cars" id="cars"><div class="empty">waiting for telemetry&hellip;</div></div>
    </section>

    <section style="margin-top:20px">
      <h2>History &mdash; continuous aggregates</h2>
      <form id="queryForm">
        <select id="carSelect"></select>
        <select id="sensorSelect"></select>
        <select id="resolution">
          <option value="ONE_MINUTE">1 minute</option>
          <option value="ONE_HOUR">1 hour</option>
        </select>
        <button type="submit">query</button>
      </form>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
      <div id="queryNote"></div>
    </section>
  </div>

  <section>
    <h2>Alerts</h2>
    <div id="alerts"><div class="empty">none</div></div>
  </section>
</main>

<script>
const latest = new Map();
let rollupCount = 0, alertCount = 0;
const alerting = new Set();

const statusEl = document.getElementById("status");
const carsEl = document.getElementById("cars");
const alertsEl = document.getElementById("alerts");

function render() {
  document.getElementById("rollupCount").textContent = rollupCount.toLocaleString();
  document.getElementById("alertCount").textContent = alertCount.toLocaleString();
  document.getElementById("channelCount").textContent = latest.size.toLocaleString();

  const byCar = new Map();
  for (const [key, value] of latest) {
    const carId = key.split("|")[0];
    if (!byCar.has(carId)) byCar.set(carId, []);
    byCar.get(carId).push(value);
  }
  if (byCar.size === 0) return;

  carsEl.innerHTML = "";
  for (const carId of [...byCar.keys()].sort()) {
    const card = document.createElement("div");
    card.className = alerting.has(carId) ? "car alerting" : "car";
    const rows = byCar.get(carId)
      .sort((a, b) => a.sensorId.localeCompare(b.sensorId))
      .slice(0, 8)
      .map(r => `<div class="row"><span>${r.sensorId}</span><span>${r.average.toFixed(1)}</span></div>`)
      .join("");
    card.innerHTML = `<h3>${carId}</h3>${rows}`;
    carsEl.appendChild(card);
  }
}

function addAlert(alert) {
  alertCount++;
  alerting.add(alert.carId);
  if (alertsEl.querySelector(".empty")) alertsEl.innerHTML = "";
  const el = document.createElement("div");
  el.className = "alert";
  el.innerHTML = `<b>${alert.carId}</b> ${alert.sensorId}
    <small>max ${alert.observedMaximum.toFixed(1)} &gt; threshold ${alert.threshold.toFixed(1)}</small>
    <small>${new Date(alert.windowStart).toLocaleTimeString()}</small>`;
  alertsEl.prepend(el);
  while (alertsEl.children.length > 100) alertsEl.lastChild.remove();
}

function connect() {
  const source = new EventSource("/api/v1/live/stream");
  source.onopen = () => { statusEl.textContent = "live"; statusEl.className = "live"; };
  source.onerror = () => { statusEl.textContent = "reconnecting"; statusEl.className = "down"; };
  source.addEventListener("rollup", e => {
    const rollup = JSON.parse(e.data);
    if (rollup.windowLength !== "PT1S") return;
    rollupCount++;
    latest.set(rollup.carId + "|" + rollup.sensorId, rollup);
  });
  source.addEventListener("alert", e => addAlert(JSON.parse(e.data)));
}

async function loadOptions() {
  const [cars, sensors] = await Promise.all([
    fetch("/api/v1/telemetry/cars").then(r => r.json()).catch(() => []),
    fetch("/api/v1/telemetry/sensors").then(r => r.json()).catch(() => [])
  ]);
  fill("carSelect", cars);
  fill("sensorSelect", sensors);
}

function fill(id, values) {
  const select = document.getElementById(id);
  select.innerHTML = values.map(v => `<option>${v}</option>`).join("");
}

function drawChart(rows) {
  const canvas = document.getElementById("chart");
  const scale = window.devicePixelRatio || 1;
  const width = canvas.clientWidth, height = 220;
  canvas.width = width * scale; canvas.height = height * scale;
  const context = canvas.getContext("2d");
  context.scale(scale, scale);
  context.clearRect(0, 0, width, height);
  if (rows.length === 0) return;

  const values = rows.flatMap(r => [r.minimum, r.maximum]);
  const low = Math.min(...values), high = Math.max(...values);
  const span = (high - low) || 1;
  const x = i => 40 + (i / Math.max(rows.length - 1, 1)) * (width - 60);
  const y = v => height - 24 - ((v - low) / span) * (height - 48);

  context.strokeStyle = "#2a2a45";
  context.beginPath(); context.moveTo(40, y(low)); context.lineTo(width - 20, y(low));
  context.moveTo(40, y(high)); context.lineTo(width - 20, y(high)); context.stroke();

  context.fillStyle = "#8888a8"; context.font = "11px monospace";
  context.fillText(high.toFixed(1), 4, y(high) + 4);
  context.fillText(low.toFixed(1), 4, y(low) + 4);

  context.strokeStyle = "#f0196a"; context.lineWidth = 2; context.beginPath();
  rows.forEach((r, i) => i === 0 ? context.moveTo(x(i), y(r.average)) : context.lineTo(x(i), y(r.average)));
  context.stroke();
}

document.getElementById("queryForm").addEventListener("submit", async event => {
  event.preventDefault();
  const carId = document.getElementById("carSelect").value;
  const sensorId = document.getElementById("sensorSelect").value;
  const resolution = document.getElementById("resolution").value;
  const note = document.getElementById("queryNote");
  const started = performance.now();
  const response = await fetch(
    `/api/v1/telemetry/rollups?carId=${carId}&sensorId=${sensorId}&resolution=${resolution}`
    + `&from=${new Date(Date.now() - 86400000).toISOString()}`);
  if (!response.ok) {
    note.textContent = "no rollups stored for that channel yet";
    drawChart([]);
    return;
  }
  const rows = await response.json();
  drawChart(rows);
  note.textContent = `${rows.length} buckets in ${Math.round(performance.now() - started)} ms`;
});

fetch("/api/v1/live/alerts").then(r => r.json()).then(list => list.slice().reverse().forEach(addAlert)).catch(() => {});
loadOptions();
connect();
setInterval(render, 500);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitwall</title>
<style>
  :root {
    --ink: #07090b;
    --panel: #0e1317;
    --sunk: #0a0f12;
    --rule: #1b242b;
    --mist: #7c8f9a;
    --chalk: #e9f1f4;
    --petronas: #00d2be;
    --flag: #ff4d6d;

    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --grotesque: "Helvetica Neue", "Arial Narrow", Inter, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--chalk);
    font: 13px/1.5 var(--mono);
    -webkit-font-smoothing: antialiased;
    height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  :focus-visible { outline: 2px solid var(--petronas); outline-offset: 2px; }

  .label {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--mist);
  }
  .num { font-variant-numeric: tabular-nums; }

  /* ---- masthead ---- */
  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid var(--rule); background: var(--panel);
  }
  .mark { font: 700 16px/1 var(--grotesque); letter-spacing: 6px; text-transform: uppercase; }
  .mark span { color: var(--petronas); }
  .team { border-left: 1px solid var(--rule); padding-left: 16px; }
  .team b { display: block; font: 600 11px/1.5 var(--grotesque); letter-spacing: 2.5px; text-transform: uppercase; }
  .feed { margin-left: auto; display: flex; gap: 18px; align-items: baseline; }
  .feed div { text-align: right; }
  .feed b { display: block; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #status { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--mist); }
  #status::before {
    content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; margin-right: 7px; vertical-align: middle;
  }
  #status.live { color: var(--petronas); }
  #status.down { color: var(--flag); }

  /* ---- shell ---- */
  main {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 16px; padding: 16px 20px;
  }
  .column { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  section { background: var(--panel); border: 1px solid var(--rule); display: flex; flex-direction: column; }
  .column > section { flex: 0 0 auto; }
  .column > section.grow { flex: 1 1 auto; min-height: 0; }
  section + section { margin-top: 16px; }

  /* A single column cannot fit a phone screen, so give the document back its scroll. */
  @media (max-width: 1040px) {
    body { height: auto; overflow: auto; }
    main { grid-template-columns: minmax(0,1fr); padding-bottom: 40px; }
    .column, section, .grow { min-height: auto; flex: 0 0 auto; }
    .chart-wrap { height: 260px; }
  }
  section > h2 {
    flex: 0 0 auto;
    margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--rule);
    font: inherit; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--mist);
  }

  /* ---- the garage ---- */
  .garage { flex: 0 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1px; background: var(--rule); }
  .driver { background: var(--panel); padding: 16px; }
  .nameplate { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .cap {
    background: var(--petronas); color: #04231f; font: 700 13px/1 var(--mono);
    padding: 5px 7px; font-variant-numeric: tabular-nums;
  }
  .who { font: 400 17px/1 var(--grotesque); letter-spacing: .3px; color: var(--mist); }
  .who b { font-weight: 700; color: var(--chalk); text-transform: uppercase; letter-spacing: 1px; }
  .plate { margin-left: auto; }

  .breach {
    display: flex; align-items: baseline; gap: 8px; width: 100%;
    background: var(--flag); color: #2b0410; padding: 5px 9px;
    height: 30px;
  }
  .breach.clear { background: none; visibility: hidden; }
  .breach b { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
  .breach span { font-size: 11px; font-variant-numeric: tabular-nums; margin-left: auto; }

  .instruments { display: flex; align-items: flex-start; gap: 18px; }
  .dial { width: 104px; flex: 0 0 auto; margin-right: 6px; }
  .dial figure { position: relative; margin: 0; width: 104px; height: 104px; }
  .dial svg { display: block; width: 104px; height: 104px; }
  .dial .read {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .dial .read b { font-size: 20px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .dial .read span { margin-top: 4px; }
  .scale { display: flex; justify-content: space-between; margin-top: -12px; padding: 0 6px; }
  .gear { flex: 1 1 auto; text-align: center; padding-top: 12px; }
  .gear b { display: block; font: 600 46px/1 var(--mono); font-variant-numeric: tabular-nums; }
  .gear span { display: block; margin-top: 6px; }

  .bars { margin-top: 18px; display: grid; gap: 7px; }
  .bar { display: grid; grid-template-columns: 62px minmax(0, 320px) 74px; align-items: center; gap: 10px; }
  .meter { height: 6px; background: var(--sunk); position: relative; overflow: hidden; }
  .meter i { position: absolute; inset: 0 auto 0 0; background: var(--petronas); transition: width .2s linear; }
  .bar output { text-align: right; font-variant-numeric: tabular-nums; font-size: 11px; }

  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--rule); }
  .facts b { display: block; margin-top: 3px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .facts b.over { color: var(--flag); }

  .nosignal { color: var(--mist); }
  .nosignal b { color: var(--mist); }

  /* ---- analysis ---- */
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 14px; }
  select, button, input {
    background: var(--sunk); color: var(--chalk); border: 1px solid var(--rule);
    padding: 6px 9px; font: inherit; font-size: 12px;
  }
  input::placeholder { color: var(--mist); }
  button { cursor: pointer; color: var(--petronas); }
  button:hover { background: var(--petronas); color: #04231f; }
  .controls { flex: 0 0 auto; }
  .picker { flex: 0 0 auto; padding: 0 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 2px 0; }
  .chip {
    background: var(--sunk); border: 1px solid var(--rule); color: var(--mist);
    padding: 3px 9px; font: inherit; font-size: 11px; cursor: pointer;
  }
  .chip:hover { color: var(--chalk); }
  .chip[aria-pressed="true"] { background: var(--petronas); color: #04231f; font-weight: 600; }
  .picker p { margin: 8px 0 0; }
  #chart { display: block; width: 100%; height: 100%; }
  .chart-wrap { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 14px 0; }
  #queryNote { flex: 0 0 auto; padding: 10px 14px 14px; }

  /* ---- side ---- */
  .breaches { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .breaches li { display: block; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
  .breaches ol { margin: 0; padding: 0; list-style: none; }
  .breaches .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .breaches .head b { font: 600 12px/1 var(--grotesque); letter-spacing: .5px; text-transform: uppercase; }
  .breaches .over { color: var(--flag); font-variant-numeric: tabular-nums; }
  .breaches .detail { margin-top: 4px; color: var(--mist); font-size: 11px; font-variant-numeric: tabular-nums; }
  .strip { flex: 0 0 auto; max-height: 220px; overflow-y: auto; }
  .strip li { display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid var(--rule); }
  .strip ol { margin: 0; padding: 0; list-style: none; }
  .strip span:last-child { font-variant-numeric: tabular-nums; }
  .empty { padding: 14px; color: var(--mist); font-size: 11px; }
</style>
</head>
<body>

<header>
  <span class="mark">Pit<span>wall</span></span>
  <span class="team"><b>Mercedes-AMG Petronas</b><span class="label">Simulated telemetry</span></span>
  <span id="status">Connecting</span>
  <span class="feed">
    <div><span class="label">Rollups</span><b id="rollupCount">0</b></div>
    <div><span class="label">Breaches</span><b id="alertCount">0</b></div>
    <div><span class="label">Channels</span><b id="channelCount">0</b></div>
  </span>
</header>

<main>
  <div class="column">
    <section>
      <h2>The garage &middot; latest one-second window</h2>
      <div class="garage" id="garage"></div>
    </section>

    <section class="grow">
      <h2>Telemetry analysis &middot; continuous aggregates</h2>
      <div class="controls">
        <select id="carSelect" aria-label="Car"></select>
        <select id="resolution" aria-label="Bucket size">
          <option value="ONE_MINUTE">1 minute buckets</option>
          <option value="ONE_HOUR">1 hour buckets</option>
        </select>
        <input id="chipFilter" type="search" placeholder="search channels" aria-label="Search channels" size="16">
        <button id="runQuery" type="button">Plot channels</button>
      </div>
      <div class="picker">
        <div class="chips" id="chips"></div>
        <p class="label" id="chipNote"></p>
      </div>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
      <p class="label" id="queryNote">Loading the aggregates&hellip;</p>
    </section>
  </div>

  <div class="column">
    <section class="grow">
      <h2>Breaches</h2>
      <div class="breaches" id="breaches"><p class="empty">No channel over threshold.</p></div>
    </section>
    <section>
      <h2>Rest of the grid</h2>
      <div class="strip" id="strip"><p class="empty">No other cars on track.</p></div>
    </section>
  </div>
</main>

<script>
// Display names only. The pipeline carries car ids and knows nothing of drivers.
const DRIVERS = {
  "CAR-01": { number: 63, given: "George", family: "Russell" },
  "CAR-02": { number: 12, given: "Kimi",   family: "Antonelli" }
};
const GARAGE = Object.keys(DRIVERS);

const DIALS = [
  { sensorId: "speed",      unit: "km/h", min: 0, max: 360,   decimals: 0 },
  { sensorId: "engine-rpm", unit: "rpm",  min: 0, max: 15000, decimals: 0 }
];
const BARS = [
  { sensorId: "throttle-position", label: "Throttle", min: 0, max: 100, unit: "%" },
  { sensorId: "brake-pressure",    label: "Brake",    min: 0, max: 140, unit: "bar" }
];

const CENTRE = 52, RADIUS = 43;
const ARC = arcPath();
const ARC_LENGTH = 2 * Math.PI * RADIUS * 0.75;
const SERIES_COLOURS = ["#00d2be", "#ffb43d", "#ff4d6d", "#79a9ff", "#c3ced4", "#7ee787"];
const MAX_SERIES = SERIES_COLOURS.length;
const STALE_AFTER = 6000;
const BREACH_HOLDS = 30000;

const latest = new Map();
const session = new Map();
const breaches = new Map();
let rollupCount = 0, alertCount = 0;
let selected = [];
let lastSeries = [];
let lastChartWrapHeight = 0;

const statusEl = document.getElementById("status");
const garageEl = document.getElementById("garage");
const breachesEl = document.getElementById("breaches");
const stripEl = document.getElementById("strip");

function arcPath() {
  const offset = RADIUS * Math.sin(Math.PI * 0.75);
  const drop = RADIUS * Math.cos(Math.PI * 0.75);
  const startX = (CENTRE - offset).toFixed(2), endX = (CENTRE + offset).toFixed(2);
  const y = (CENTRE - drop).toFixed(2);
  return `M${startX} ${y} A${RADIUS} ${RADIUS} 0 1 1 ${endX} ${y}`;
}

function reading(carId, sensorId) { return latest.get(carId + "|" + sensorId); }

function record(rollup) {
  const key = rollup.carId + "|" + rollup.sensorId;
  latest.set(key, rollup);
  const running = session.get(key);
  session.set(key, {
    maximum: running ? Math.max(running.maximum, rollup.maximum) : rollup.maximum,
    total: (running ? running.total : 0) + rollup.average * rollup.count,
    count: (running ? running.count : 0) + rollup.count,
    at: Date.now()
  });
}

function activeBreach(carId) {
  const breach = breaches.get(carId);
  if (!breach) return null;
  if (Date.now() - breach.at > BREACH_HOLDS) { breaches.delete(carId); return null; }
  return breach;
}

function hasSignal(carId) {
  const running = session.get(carId + "|speed");
  return Boolean(running) && Date.now() - running.at <= STALE_AFTER;
}

function dial(carId, spec, breached) {
  const row = reading(carId, spec.sensorId);
  const value = row ? row.average : null;
  const fraction = value === null ? 0 : (value - spec.min) / (spec.max - spec.min);
  const filled = Math.max(0, Math.min(1, fraction)) * ARC_LENGTH;
  const colour = breached === spec.sensorId ? "var(--flag)" : "var(--petronas)";
  return `<div class="dial">
    <figure>
      <svg viewBox="0 0 104 104" role="img" aria-label="${spec.sensorId} ${value === null ? "no data" : value.toFixed(spec.decimals) + " " + spec.unit}">
        <path d="${ARC}" fill="none" stroke="var(--sunk)" stroke-width="8"/>
        <path d="${ARC}" fill="none" stroke="${colour}" stroke-width="8"
              stroke-dasharray="${filled.toFixed(2)} ${ARC_LENGTH.toFixed(2)}"/>
      </svg>
      <span class="read">
        <b>${value === null ? "&ndash;&ndash;" : value.toFixed(spec.decimals)}</b>
        <span class="label">${spec.unit}</span>
      </span>
    </figure>
    <div class="scale label num"><span>${spec.min}</span><span>${spec.max}</span></div>
  </div>`;
}

function driverCard(carId) {
  const driver = DRIVERS[carId];
  const breach = activeBreach(carId);
  const live = hasSignal(carId);

  const nameplate = `<div class="nameplate">
      <span class="cap">${driver.number}</span>
      <span class="who">${driver.given} <b>${driver.family}</b></span>
      <span class="label plate">${carId}</span>
      ${breach
        ? `<span class="breach"><b>Over threshold</b>
             <span>${breach.sensorId} &nbsp;${breach.observed.toFixed(0)} / ${breach.threshold.toFixed(0)}</span></span>`
        : `<span class="breach clear" aria-hidden="true"></span>`}
    </div>`;

  if (!live) {
    return `<article class="driver nosignal">${nameplate}
      <p class="label">No signal. The source is not publishing for this car.</p></article>`;
  }

  const gearRow = reading(carId, "gear");
  const instruments = `<div class="instruments">
      ${DIALS.map(spec => dial(carId, spec, breach && breach.sensorId)).join("")}
      <div class="gear"><b>${gearRow ? Math.round(gearRow.average) : "&ndash;"}</b><span class="label">Gear</span></div>
    </div>`;

  const bars = BARS.map(spec => {
    const row = reading(carId, spec.sensorId);
    const value = row ? row.average : null;
    const percent = value === null ? 0 : ((value - spec.min) / (spec.max - spec.min)) * 100;
    return `<div class="bar">
      <span class="label">${spec.label}</span>
      <span class="meter"><i style="width:${Math.max(0, Math.min(100, percent)).toFixed(1)}%"></i></span>
      <output>${value === null ? "&ndash;&ndash;" : value.toFixed(1) + " " + spec.unit}</output>
    </div>`;
  }).join("");

  const speed = session.get(carId + "|speed");
  const brake = session.get(carId + "|brake-temperature-front-left");
  const brakeBreached = breach && breach.sensorId === "brake-temperature-front-left";

  return `<article class="driver">${nameplate}${instruments}
    <div class="bars">${bars}</div>
    <div class="facts">
      <div><span class="label">Average speed</span><b>${speed ? (speed.total / speed.count).toFixed(0) + " km/h" : "&ndash;&ndash;"}</b></div>
      <div><span class="label">Top speed</span><b>${speed ? speed.maximum.toFixed(0) + " km/h" : "&ndash;&ndash;"}</b></div>
      <div><span class="label">Brake FL peak</span><b class="${brakeBreached ? "over" : ""}">${brake ? brake.maximum.toFixed(0) + " C" : "&ndash;&ndash;"}</b></div>
    </div>
  </article>`;
}

function render() {
  document.getElementById("rollupCount").textContent = rollupCount.toLocaleString();
  document.getElementById("alertCount").textContent = alertCount.toLocaleString();
  document.getElementById("channelCount").textContent = latest.size.toLocaleString();

  garageEl.innerHTML = GARAGE.map(driverCard).join("");

  const others = new Set();
  for (const rollup of latest.values()) {
    if (!DRIVERS[rollup.carId]) others.add(rollup.carId);
  }
  stripEl.innerHTML = others.size === 0
    ? `<p class="empty">No other cars on track.</p>`
    : `<ol>${[...others].sort().map(carId => {
        const speed = reading(carId, "speed");
        return `<li><span>${carId}</span><span>${speed ? speed.average.toFixed(0) + " km/h" : "&ndash;&ndash;"}</span></li>`;
      }).join("")}</ol>`;

  syncChartHeight();
}

// The chart's share of the shell changes after first paint as the garage fills
// in and the picker collapses. Polled off this tick rather than watched with a
// ResizeObserver: RO and requestAnimationFrame are both throttled in a hidden
// tab, so the chart would stay stuck at whatever height it was first given.
function syncChartHeight() {
  const wrap = document.querySelector(".chart-wrap");
  if (wrap.clientHeight === lastChartWrapHeight) return;
  lastChartWrapHeight = wrap.clientHeight;
  drawChart(lastSeries);
}

function addBreach(alert) {
  alertCount++;
  breaches.set(alert.carId, {
    sensorId: alert.sensorId,
    observed: alert.observedMaximum,
    threshold: alert.threshold,
    at: Date.now()
  });

  let list = breachesEl.querySelector("ol");
  if (!list) { breachesEl.innerHTML = "<ol></ol>"; list = breachesEl.querySelector("ol"); }
  const driver = DRIVERS[alert.carId];
  const item = document.createElement("li");
  item.innerHTML = `<span class="head"><b>${driver ? driver.family : alert.carId}</b>
      <span class="over">+${(alert.observedMaximum - alert.threshold).toFixed(0)}</span></span>
    <span class="detail">${alert.sensorId}<br>${alert.observedMaximum.toFixed(1)} over ${alert.threshold.toFixed(0)}
      &middot; ${new Date(alert.windowStart).toLocaleTimeString()}</span>`;
  list.prepend(item);
  while (list.children.length > 100) list.lastChild.remove();
}

function connect() {
  const source = new EventSource("/api/v1/live/stream");
  source.onopen = () => { statusEl.textContent = "Live"; statusEl.className = "live"; };
  source.onerror = () => { statusEl.textContent = "Reconnecting"; statusEl.className = "down"; };
  source.addEventListener("rollup", event => {
    const rollup = JSON.parse(event.data);
    if (rollup.windowLength !== "PT1S") return;
    rollupCount++;
    record(rollup);
  });
  source.addEventListener("alert", event => addBreach(JSON.parse(event.data)));
}

async function loadOptions() {
  const [cars, sensors] = await Promise.all([
    fetch("/api/v1/telemetry/cars").then(response => response.json()).catch(() => []),
    fetch("/api/v1/telemetry/sensors").then(response => response.json()).catch(() => [])
  ]);

  const carSelect = document.getElementById("carSelect");
  carSelect.innerHTML = cars.map(carId => {
    const driver = DRIVERS[carId];
    return `<option value="${carId}">${driver ? driver.family + " · " + carId : carId}</option>`;
  }).join("");
  const mercedes = cars.find(carId => DRIVERS[carId]);
  if (mercedes) carSelect.value = mercedes;

  // Named channels first; the aux-* padding exists to make the load dial reach a
  // channel count, and burying the real ones under it makes the picker useless.
  const ordered = sensors.slice().sort((left, right) => {
    const leftAux = left.startsWith("aux-channel-"), rightAux = right.startsWith("aux-channel-");
    return leftAux === rightAux ? left.localeCompare(right) : (leftAux ? 1 : -1);
  });

  const chipsEl = document.getElementById("chips");
  chipsEl.innerHTML = ordered.map(sensorId =>
    `<button type="button" class="chip" aria-pressed="false" data-sensor="${sensorId}">${sensorId}</button>`).join("");
  chipsEl.addEventListener("click", event => {
    const chip = event.target.closest(".chip");
    if (!chip) return;
    const sensorId = chip.dataset.sensor;
    if (selected.includes(sensorId)) {
      selected = selected.filter(id => id !== sensorId);
      chip.setAttribute("aria-pressed", "false");
    } else if (selected.length < MAX_SERIES) {
      selected.push(sensorId);
      chip.setAttribute("aria-pressed", "true");
    }
    refreshChips();
  });

  document.getElementById("chipFilter").addEventListener("input", refreshChips);

  ["speed", "engine-rpm", "brake-pressure"].forEach(sensorId => {
    const chip = chipsEl.querySelector(`[data-sensor="${sensorId}"]`);
    if (chip) { selected.push(sensorId); chip.setAttribute("aria-pressed", "true"); }
  });
  refreshChips();
}

// Sixty of the hundred channels are aux-* padding, so listing them all buries
// the panel. Selected channels stay put; the rest arrive through the search.
function refreshChips() {
  const term = document.getElementById("chipFilter").value.trim().toLowerCase();
  document.querySelectorAll(".chip").forEach(chip => {
    const isSelected = selected.includes(chip.dataset.sensor);
    chip.hidden = !isSelected && (term === "" || !chip.dataset.sensor.includes(term));
  });

  const total = document.querySelectorAll(".chip").length;
  const shown = document.querySelectorAll(".chip:not([hidden])").length;
  document.getElementById("chipNote").textContent = term === ""
    ? `${selected.length} of ${total} channels plotted, ${MAX_SERIES} at most. Search to add another.`
    : `${shown} channel${shown === 1 ? "" : "s"} matching "${term}", ${selected.length} plotted.`;
}

const MIN_LANE = 34;

function drawChart(series) {
  const canvas = document.getElementById("chart");
  const plotted = series.filter(entry => entry.rows.length > 0);
  const count = Math.max(plotted.length, 1);

  // The lane height comes from whatever the shell has left over, so the panel
  // fills the screen instead of reserving a fixed strip. Below MIN_LANE a trace
  // is too short to read anything from, so the wrapper scrolls instead.
  const available = canvas.parentElement.clientHeight - 6;
  const lane = available > 0 ? Math.max(available / count, MIN_LANE) : 58;
  const height = Math.max(lane * count, available > 0 ? available : 0);
  canvas.style.height = height + "px";

  const ratio = window.devicePixelRatio || 1;
  const width = canvas.clientWidth;
  canvas.width = width * ratio; canvas.height = height * ratio;
  const context = canvas.getContext("2d");
  context.scale(ratio, ratio);
  context.clearRect(0, 0, width, height);
  if (plotted.length === 0) return;

  // Most named channels ride the same lap simulation, so scaled to their own
  // ranges they overlay exactly and every trace but the last disappears.
  const buckets = Math.max(...plotted.map(entry => entry.rows.length));
  plotted.forEach((entry, index) => {
    const colour = SERIES_COLOURS[index % MAX_SERIES];
    const top = index * lane + 18, bottom = index * lane + lane - 6;

    context.strokeStyle = "#131c22"; context.lineWidth = 1;
    context.beginPath(); context.moveTo(0, bottom + 3); context.lineTo(width, bottom + 3); context.stroke();

    const values = entry.rows.map(row => row.average);
    const low = Math.min(...values), high = Math.max(...values);
    const span = (high - low) || 1;

    context.strokeStyle = colour; context.lineWidth = 1.6;
    context.beginPath();
    values.forEach((value, position) => {
      const x = (position / Math.max(buckets - 1, 1)) * width;
      const y = bottom - ((value - low) / span) * (bottom - top);
      position === 0 ? context.moveTo(x, y) : context.lineTo(x, y);
    });
    context.stroke();

    context.font = "9px " + getComputedStyle(document.body).fontFamily;
    context.fillStyle = colour;
    context.fillText(entry.sensorId.toUpperCase(), 0, index * lane + 11);
    context.fillStyle = "#7c8f9a";
    const range = `${low.toFixed(1)} to ${high.toFixed(1)}`;
    context.fillText(range, width - context.measureText(range).width, index * lane + 11);
  });
}

async function runQuery() {
  const carId = document.getElementById("carSelect").value;
  const resolution = document.getElementById("resolution").value;
  const note = document.getElementById("queryNote");

  if (selected.length === 0) {
    note.textContent = "Pick at least one channel to plot.";
    lastSeries = []; drawChart([]);
    return;
  }

  note.textContent = "Querying the aggregates…";
  const from = new Date(Date.now() - 86400000).toISOString();
  const started = performance.now();
  const series = await Promise.all(selected.map(async sensorId => {
    const response = await fetch(
      `/api/v1/telemetry/rollups?carId=${carId}&sensorId=${sensorId}&resolution=${resolution}&from=${from}`);
    return { sensorId, rows: response.ok ? await response.json() : [] };
  }));
  const elapsed = Math.round(performance.now() - started);

  lastSeries = series;
  drawChart(series);
  const buckets = series.reduce((total, entry) => total + entry.rows.length, 0);
  note.textContent = buckets === 0
    ? "No buckets stored for those channels yet. Let the pipeline run for a minute."
    : `${buckets} buckets across ${series.length} channels in ${elapsed} ms, read from the aggregates.`;
}

document.getElementById("runQuery").addEventListener("click", runQuery);
window.addEventListener("resize", () => drawChart(lastSeries));

fetch("/api/v1/live/alerts")
  .then(response => response.json())
  .then(list => list.slice().reverse().forEach(addBreach))
  .catch(() => {});
loadOptions().then(() => { if (selected.length > 0) runQuery(); });
connect();
render();
setInterval(render, 400);
</script>
</body>
